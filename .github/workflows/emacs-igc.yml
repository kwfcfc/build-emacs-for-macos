---
# Build Emacs-IGC.app from emacs-mirror/emacs feature/igc3 on a GitHub-hosted
# Apple silicon runner and ship it as a DMG, so no toolchain or build output
# lands on the local machine. The build itself is scripts/igc/emacs-igc, the
# same script used for local builds. Runs only when triggered by hand.
name: Emacs-IGC

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "feature/igc3 commit (full 40-character SHA; empty: branch head)"
        required: false
        default: ""
      force:
        description: "Rebuild even when a release for this commit exists"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub release (otherwise only a workflow artifact)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IGC_GITHUB_REPO: emacs-mirror/emacs
  IGC_BRANCH: feature/igc3

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      # Runs on Linux so that an already released commit costs no macOS time.
      - name: Resolve the commit and look for an existing release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          sha=$(tr -d '[:space:]' <<<"$INPUT_SHA")
          if [[ -z $sha ]]; then
            sha=$(git ls-remote "https://github.com/$IGC_GITHUB_REPO.git" \
              "refs/heads/$IGC_BRANCH" | cut -f1)
          fi
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA, got '$sha'"
            exit 1
          fi
          tag=emacs-igc-${sha:0:7}
          build=true
          if [[ $FORCE != true ]] &&
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists; nothing to build (run with force to rebuild)"
            build=false
          fi
          {
            echo "sha=$sha"
            echo "sha7=${sha:0:7}"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$PUBLISH"
          } >>"$GITHUB_OUTPUT"
          echo "Commit: https://github.com/$IGC_GITHUB_REPO/commit/$sha (build: $build, publish: $PUBLISH)"

  build:
    name: Build on macOS 26 (arm64)
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    # Must match IGC_NIX_SHELL: the build runs the new Emacs (dump, native
    # compilation, tests), so the runner needs at least the target macOS.
    runs-on: macos-26
    timeout-minutes: 300
    env:
      IGC_SHA: ${{ needs.resolve.outputs.sha }}
      IGC_NIX_SHELL: .#macos26
      IGC_WORK_ROOT: ${{ github.workspace }}/builds
      IGC_WORK: ${{ github.workspace }}/builds/igc-${{ needs.resolve.outputs.sha7 }}
      IGC_APP: ${{ github.workspace }}/builds/igc-${{ needs.resolve.outputs.sha7 }}/builds/Emacs-IGC/Emacs-IGC.app
      DIST_NAME: Emacs-IGC-${{ needs.resolve.outputs.sha7 }}
    steps:
      - name: Check out the builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the runner
        run: |
          set -euo pipefail
          sw_vers
          echo "CPUs: $(sysctl -n hw.logicalcpu), memory: $(($(sysctl -n hw.memsize) / 1073741824)) GiB"
          # build-emacs-for-macos links Emacs against the system ncurses stub.
          stub=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib/libncurses.tbd
          if [[ ! -f $stub ]]; then
            echo "::error::Missing $stub; the runner image has no Command Line Tools"
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE"

      - name: Free disk space
        run: |
          set -euo pipefail
          avail=$(df -g "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')
          echo "Available: $avail GiB"
          # Nix toolchain, sources and the bundle need roughly 10-15 GiB.
          if ((avail < 20)); then
            echo "Removing the preinstalled Android SDK"
            sudo rm -rf "${ANDROID_HOME:-$HOME/Library/Android/sdk}"
            df -h "$GITHUB_WORKSPACE"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}

      - name: Build, package and verify
        env:
          # build-emacs-for-macos authenticates its GitHub API requests with it.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/igc/emacs-igc build "$IGC_SHA"

      - name: GUI smoke test
        # A Cocoa frame on a headless runner session is best effort.
        continue-on-error: true
        run: scripts/igc/emacs-igc gui-test "$IGC_APP"

      - name: Create the disk image
        run: |
          set -euo pipefail
          dist=$RUNNER_TEMP/dist
          mkdir -p "$dist"
          scripts/igc/emacs-igc dmg "$IGC_APP" "$dist/$DIST_NAME.dmg"
          (cd "$dist" && shasum -a 256 "$DIST_NAME.dmg" >"$DIST_NAME.dmg.sha256")
          cp "$IGC_WORK/build-manifest.json" "$IGC_WORK/bundle-audit.json" "$dist/"
          ls -lh "$dist"
          cat "$dist/$DIST_NAME.dmg.sha256"

      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DIST_NAME }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14
          # The DMG is already compressed.
          compression-level: 0

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DIST_NAME }}-logs
          path: |
            builds/igc-*/build.log
            builds/igc-*/sources/*/config.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Only this job can write; the build job runs downloaded sources and
    # patches with a read-only token.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.resolve.outputs.sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      DIST_NAME: Emacs-IGC-${{ needs.resolve.outputs.sha7 }}
    steps:
      - name: Download the disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.DIST_NAME }}
          path: dist

      - name: Create or update the release
        run: |
          set -euo pipefail
          cd dist
          manifest=build-manifest.json
          committed=$(gh api "repos/$IGC_GITHUB_REPO/commits/$SHA" \
            --jq .commit.committer.date || echo unknown)
          cat >notes.md <<EOF
          Emacs-IGC built from [\`$IGC_GITHUB_REPO\` \`$IGC_BRANCH\`](https://github.com/$IGC_GITHUB_REPO/commit/$SHA) at \`$SHA\` (committed $committed).

          - Builder: [\`${GITHUB_SHA:0:7}\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Toolchain: \`nix develop $(jq -r .nix_shell "$manifest")\`, nixpkgs \`$(jq -r .nixpkgs "$manifest" | cut -c1-12)\`; Apple silicon, macOS 26 or later
          - Options: \`$(jq -r .build_options "$manifest")\`, $(jq -r .bundled_eln_files "$manifest") bundled \`.eln\` files
          - Ad-hoc signed, not notarized. \`Contents/Resources/igc-source-commit.txt\` holds the source commit.

          Install with the builder checkout (stops and restarts Emacs-IGC daemons, keeps a backup, rolls back on failure):

          \`\`\`sh
          gh release download $TAG --repo $GITHUB_REPOSITORY --pattern '$DIST_NAME.dmg*'
          shasum -a 256 -c $DIST_NAME.dmg.sha256
          scripts/igc/emacs-igc install $DIST_NAME.dmg
          \`\`\`

          SHA-256: \`$(cut -d' ' -f1 "$DIST_NAME.dmg.sha256")\`
          EOF
          assets=("$DIST_NAME.dmg" "$DIST_NAME.dmg.sha256" "$manifest")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
              --title "Emacs-IGC ${SHA:0:7} ($IGC_BRANCH)" --notes-file notes.md
          fi
